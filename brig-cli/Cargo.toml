[package]
name = "brig-cli"
version = "0.1.0"
edition = "2024"
default-run = "brig-cli"

[dependencies]
common = { path = "../common" }

ovmf-prebuilt = "0.2.7" # used for UEFI booting in QEMU
bootloader = { version = "0.11.15", default-features = false, features = ["uefi"] }
cargo_metadata = "0.23.1"
itertools = "0.14.0"
clap = { version = "4.5.60", features = ["derive"] }
color-eyre = "0.6.5"
tar = "0.4.44"
walkdir = "2.5.0"
elf = "0.8.0"
postcard = { version = "1.1.3", features = ["alloc"] }
memmap2 = "0.9.10"
clap-num = "1.2.0"
embedded-time = "0.12.1"
bootloader-boot-config = "0.11.15"
signal-hook = "0.4.3"
perf-event-open-sys2 = "5.0.6"
log = "0.4.33"
pretty_env_logger = "0.5.0"
displaydoc = "0.2.6"
thiserror = "2.0.19"
