[package]
name = "brig-cli"
version = "0.1.0"
edition = "2024"
default-run = "brig-cli"

[dependencies]
common = { path = "../common" }

ovmf-prebuilt = "0.2.4" # used for UEFI booting in QEMU
bootloader = { version = "0.11.12", default-features = false, features = ["uefi"] }
cargo_metadata = "0.23.0"
itertools = "0.14.0"
clap = { version = "4.5.49", features = ["derive"] }
color-eyre = "0.6.5"
tar = "0.4.44"
walkdir = "2.5.0"
elf = "0.8.0"
postcard = { version = "1.1.3", features = ["alloc"] }
memmap2 = "0.9.8"
clap-num = "1.2.0"
embedded-time = "0.12.1"
bootloader-boot-config = "0.11.12"
