[package]
name = "kernel"
version = "0.1.0"
edition = "2024"


[dependencies]
common = { path = "../common" }

bootloader_api = "0.11.12"
x86_64 = "0.15.2"
x86 = "0.52.0"
x2apic = "0.5.0"
uart_16550 = "0.4.0"
acpi = "6.0.1"
virtio-drivers = { version = "0.12.0", features = ["alloc"] }

buddy_system_allocator = "0.11.0"
#talc = { version = "4.4.2", features = ["counters"] } // weirdly slow
#linked_list_allocator = "0.10.5" // only supports single backing chunk

spin = "0.10.0"
log = { version = "0.4.28", default-features = false }
elf = { version = "0.8.0", default-features = false }
rustc-demangle = { version = "0.1.26", default-features = false }
tar-no-std = { version = "0.4.2", features = ["alloc"] }
thiserror = { version = "2.0.17", default-features = false }
displaydoc = { version = "0.2.5", default-features = false }
uuid = { version = "1.18.1", default-features = false }
fastrand = { version = "2.3.0", default-features = false, features = ["alloc"] }
bitset-core = { version = "0.1.1", default-features = false }
linkme = "0.3.35"
embedded-time = "0.12.1"
