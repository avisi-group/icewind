[package]
name = "dbt"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../common", features = ["no-std"] }
proc_macro_lib = { path = "../proc_macro_lib" }
brig_common = { path = "../brig_common" }

byteorder = { version = "1.5.0", default-features = false }
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
paste = "1.0.15"
log = { version = "0.4.27", default-features = false }
iced-x86 = { version = "1.21.0", default-features = false, features = [
    "decoder",
    "encoder",
    "block_encoder",
    "gas",
    "no_std",
    "code_asm"
] }
thiserror = { version = "2.0.12", default-features = false }
displaydoc = { version = "0.2.5", default-features = false }
strum = { version = "0.27.2", features = ["derive"], default-features = false }
linkme = "0.3.33"
derive-where = "1.6.0"
