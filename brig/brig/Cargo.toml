[package]
name = "brig"
version = "0.1.0"
edition = "2024"

[features]
no_logging = ["log/release_max_level_error", "log/max_level_error"]

[dependencies]
kernel = { path = "../kernel" }
dbt = { path = "../dbt" }
common = { path = "../common" }

pl011 = { path = "../devices/primecell/pl011" }
virtio = { path = "../devices/virtio" }

bootloader_api = "0.11.15"
log = { version = "0.4.29", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }
x86_64 = "0.15.4"
iced-x86 = { version = "1.21.0", default-features = false, features = [
    "decoder",
    "encoder",
    "block_encoder",
    "gas",
    "no_std",
    "code_asm",
] }
elfloader = { git = "https://github.com/avisi-group/rust-elfloader", rev = "c7e6230" }
spin = "0.10.0"
embedded-time = "0.12.1"
disarm64 = "0.1.25"
x86 = "0.52.0"
linkme = "0.3.35"
bitfields = "1.0.2"
aarch64-paging = "0.11.0"
