
[package]
name = "standalone"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = false
opt-level = 3
incremental = false
codegen-units = 1
debug-assertions = false
overflow-checks = false

[dependencies]
aarch64_interpreter = { path = "../brig/plugins/guest/devices/arm/aarch64_interpreter" }
rustix = { version = "1.1.4", features = ["mm"] }
log = "0.4.29"

