[package]
name = "brig-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
ovmf-prebuilt = "0.1.0-alpha.1" # used for UEFI booting in QEMU
bootloader = { version = "0.11.15", default-features = false, features = ["uefi"] }
cargo_metadata = "0.18.1"
itertools = "0.12.1"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6.5"
tar = "0.4.45"
walkdir = "2.5.0"
